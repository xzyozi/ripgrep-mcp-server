[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
# プロジェクト固有の情報（ここだけ書き換えればOK）
name = "my-awesome-project"  
version = "0.1.0"
description = "A modern Python project template"
readme = "README.md"
requires-python = ">=3.10"

# 必須のパッケージ
dependencies = [
    # 例: "requests>=2.31.0",
    # 例: "pydantic>=2.0.0"
]

[project.optional-dependencies]
# 開発・テスト環境専用のパッケージ（共通デファクトスタンダード）
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.0.0"
]

# ==========================================
# Linter & Formatter (Ruff)
# ==========================================
[tool.ruff]
line-length = 120
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
    "htmlcov"
]

[tool.ruff.lint]
# E: pycodestyle errors, F: Pyflakes, W: pycodestyle warnings, I: isort
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.isort]
# 自分のプロジェクトのパッケージ名を指定（自動ソート時にローカルパッケージとして認識させるため）
known-first-party = ["src", "app"]

# ==========================================
# Type Checker (Mypy)
# ==========================================
[tool.mypy]
python_version = "3.10"
# 基本的に厳しめの設定（Strict）にしておくのがモダンな手法
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
# サードパーティ製ライブラリの型定義が見つからない際のエラーを抑制
ignore_missing_imports = true

# ==========================================
# Testing (Pytest)
# ==========================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"